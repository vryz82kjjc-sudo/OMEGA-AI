function finance(tin=S.costs.tin,years=S.costs.years,opening=0,insurance=0){let p=price(),c=S.costs,loan=p*(100-c.down)/100,monthly=mortgage(loan,tin,years);return {p,loan,down:p*c.down/100,taxes:p*c.tax/100,fees:Number(c.expenses),cash:p*c.down/100+p*c.tax/100+Number(c.expenses),monthly,totalInterest:monthly*years*12-loan,total:monthly*years*12+p*c.down/100+p*c.tax/100+Number(c.expenses)+loan*opening/100+insurance*12*years,insurance,years,tin,opening}}
const b=(label,action,value='',cls='primary')=>`<button class="btn ${cls}" type="button" data-action="${esc(action)}" data-value="${esc(value)}">${label}</button>`;
const link=(label,route,cls='primary')=>b(label,'go',route,cls);
const tag=(label,kind='')=>`<span class="tag ${kind}">${label}</span>`;
const kpi=(label,value,desc='')=>`<div class="metric"><span>${label}</span><strong>${value}</strong>${desc?`<span>${desc}</span>`:''}</div>`;
const field=(label,id,val,opts={})=>`<div class="field ${opts.wide?'span2':''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${opts.type||'text'}" ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step!==undefined?`step="${opts.step}"`:''} value="${esc(val)}" ${opts.required?'required':''} ${opts.max!==undefined?`max="${opts.max}"`:''} />${opts.hint?`<small>${opts.hint}</small>`:''}</div>`;
const head=(eyebrow,title,subtitle,actions='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><div class="lead">${subtitle}</div></div><div class="row wrap">${actions}</div></div>`;
function progress(){let k=0;if(S.p.price)k++;if(S.visits.checked.length>=4)k++;if(S.nego.agreed)k++;if(S.mortgage.chosen)k++;if(S.legal.arrasSigned)k++;if(S.appraisal.done)k++;if(S.notary.signed)k++;if(S.after.done.length>=AFTER.length)k++;return k}
function log(what,where=''){S.activity.unshift({what,where});S.activity=S.activity.slice(0,45);save()}
function go(route){S.route=ROUTES.some(r=>r[0]===route)?route:'home';save();render();window.scrollTo({top:0,behavior:'instant'})}
function nav(){const groups=[['Empezar',['home','dashboard','property','valuation','visit']],['Tu operación',['negotiation','market','mortgage','documents','appraisal','legal','notary','after']],['Detrás del servicio',['agents','partners','tinyfish']]];return `<aside class="side"><div class="logo"><div class="mark">⌂</div><div><strong>Mi Inversión IA</strong><small>UNA COMPRA CON MÁS CALMA</small></div></div>${groups.map(g=>`<div class="side-group">${g[0]}</div><nav class="nav">${g[1].map(id=>{const r=ROUTES.find(x=>x[0]===id);return `<button type="button" class="${S.route===id?'active':''}" data-action="go" data-value="${id}"><span class="ic">${r[2]}</span>${r[1]}</button>`}).join('')}</nav>`).join('')}<div class="side-bottom"><strong>◉ Todo bajo control</strong><p>Demostración interactiva: datos y respuestas de empresas totalmente ficticios. No enviamos ofertas.</p></div></aside>`}
function mobileNav(){let options=[['home','⌂','Inicio'],['valuation','◫','Valorar'],['dashboard','▦','Mi compra'],['market','◇','Hall'],['agents','✦','Agentes'],['more','☰','Más']];return `<nav class="mobile-foot" aria-label="Navegación rápida">${options.map(x=>`<button type="button" class="${S.route===x[0]?'active':''}" data-action="${x[0]==='more'?'more':'go'}" data-value="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function render(){let root=document.getElementById('root');let name=ROUTES.find(x=>x[0]===S.route)?.[1]||'Inicio';root.innerHTML=`<div class="layout">${nav()}<div class="main-wrap"><div class="top"><div class="top-title">${esc(name)}</div><div class="top-right">${tag('<i class="dot"></i> SIMULACIÓN COMPLETA')} ${tag('Sin envíos reales','gray')}<div class="user" title="Cuenta de demostración">TÚ</div></div></div><main class="page" id="app-main">${page()}</main></div></div>${mobileNav()}`}

<div class="grid2"><div class="card pad"><div class="eyebrow">Tu mapa</div><h3>Del anuncio a la firma</h3><div class="itemlist">${STAGES.map((x,i)=>`<div class="item ${i<pr?'done':''}"><div class="numcircle">${i+1}</div><div style="flex:1"><strong>${x[0]}</strong><p>${x[1]}</p></div><div class="actions">${link('Abrir',x[2],'line small')}</div></div>`).join('')}</div></div><div class="gap" style="align-self:start"><div class="card pad"><div class="eyebrow">Ahora mismo</div><h3>${pr>=8?'¡Una compra de ejemplo completada!':STAGES[Math.min(pr,7)][0]}</h3><p class="muted">${pr>=8?'Consulta el resumen final y descarga tu dossier ficticio.':'Tu gestor te acompaña con explicaciones, borradores y decisiones en cada pantalla.'}</p>${link(pr>=8?'Ver cierre':'Abrir siguiente paso',pr>=8?'after':STAGES[Math.min(pr,7)][2])}</div><div class="card pad"><div class="eyebrow">Actividad</div><h3>Lo que ha pasado</h3>${S.activity.slice(0,8).map(x=>`<div class="kpi"><div><strong style="font-size:12px">${esc(x.what)}</strong><div class="tiny muted">${esc(x.where)}</div></div><span class="dot green"></span></div>`).join('')}</div><div class="side-note"><strong>Tu gestor no envía nada solo.</strong><p class="small muted" style="margin:6px 0">Cada «enviar», «firmar» o «aceptar» de esta simulación requiere una decisión tuya y solamente cambia la historia ficticia.</p>${link('Ver qué hace cada agente','agents','ghost small')}</div></div></div>${footer()}`}
function property(){let p=S.p;return `${head('Paso 00 · Tu vivienda','Todo empieza por una casa.','Puedes cambiar los datos y ver cómo se recalculan las cifras en todo el recorrido.',b('Restaurar vivienda ficticia','sample','','line'))}<div class="grid2"><div class="card pad-lg"><h3>Ficha de la vivienda</h3><p class="muted small">Esta propiedad es un ejemplo inventado. Edita la descripción sin compartir ningún dato privado.</p><form id="property-form" class="formgrid">${field('Nombre de la vivienda','pTitle',p.title,{wide:true,required:true})}${field('Dirección o barrio','pAddress',p.address,{wide:true})}${field('Ciudad','pCity',p.city,{required:true})}${field('Zona / barrio','pDistrict',p.district)}${field('Precio del anuncio (€)','pPrice',p.price,{type:'number',min:10000,required:true})}${field('Superficie construida (m²)','pArea',p.area,{type:'number',min:1,required:true})}${field('Habitaciones','pRooms',p.rooms,{type:'number',min:0})}${field('Estado','pCondition',p.condition)}${field('Enlace del anuncio (no se leerá automáticamente)','pUrl',p.url,{wide:true,hint:'El enlace se guarda como referencia, sin visitar el portal ni extraer datos.'})}<div class="span2"><button class="btn primary full" type="submit">Guardar vivienda y recalcular</button></div></form></div><div class="gap" style="align-self:start"><div class="card pad"><div class="eyebrow">Vista de tu operación</div><h3>${esc(p.title)}</h3><div class="kpi"><span>Precio del anuncio</span><strong>${eur(p.price)}</strong></div><div class="kpi"><span>Superficie</span><strong>${dec(p.area,0)} m²</strong></div><div class="kpi"><span>Precio por metro cuadrado</span><strong>${eur(p.price/p.area)}/m²</strong></div><div class="kpi"><span>Habitaciones</span><strong>${p.rooms}</strong></div><div class="kpi"><span>Ciudad</span><strong>${esc(p.city)}</strong></div><div class="row wrap" style="margin-top:17px">${link('Analizar precio','valuation')}${link('Concertar visita','visit','line')}</div></div><div class="notice"> function comparableMedian(){let a=S.comparables.filter(c=>c.price>0&&c.area>0).map(c=>c.price/c.area).sort((a,b)=>a-b);if(a.length<3)return null;return a.length%2?a[Math.floor(a.length/2)]:(a[a.length/2-1]+a[a.length/2])/2}
function valuation(){let p=S.p,c=S.costs,f=finance(),median=comparableMedian(),target=p.price/p.area,diff=median===null?null:(target/median-1)*100,cls=diff===null?'Datos insuficientes':diff<-7?'Bajo el rango de muestra':diff>7?'Sobre el rango de muestra':'Dentro del rango de muestra';return `${head('Paso 01 · Valoración','¿Qué vale realmente?','Primero sabemos cuánto cuesta. Para decir si está cara o barata, necesitamos referencias. Aquí utilizamos comparables inventados para enseñar cómo se presenta.',b('Abrir la vivienda','go','property','line'))}

<div class="card pad-lg" style="margin-top:18px"><div class="row between wrap"><div><div class="eyebrow">Tus hipótesis editables</div><h3>Calcula al momento</h3></div>${tag('Fórmula financiera real · Datos de ejemplo','green')}</div><form id="cost-form" class="formgrid">${field('Entrada sobre el precio (%)','down',c.down,{type:'number',step:1,min:0,max:100})}${field('Impuestos de compra estimados (%)','tax',c.tax,{type:'number',step:.1,min:0,max:20,hint:'Dependen de comunidad, tipo de inmueble y bonificaciones.'})}${field('Otros gastos estimados (€)','expenses',c.expenses,{type:'number',step:100,min:0})}${field('TIN hipotecario supuesto (%)','tin',c.tin,{type:'number',step:.05,min:0})}${field('Plazo (años)','years',c.years,{type:'number',min:1,max:40})}${field('Ingresos netos mensuales de ejemplo (€)','income',c.income,{type:'number',min:1,hint:'Solo se usa localmente para ilustrar el esfuerzo de pago.'})}<div class="span2"><button class="btn primary" type="submit">Recalcular toda la compra</button></div></form></div>

function negoHistory(){let messages=[{who:'Gestor del comprador · simulación',text:'Hemos revisado el anuncio. Podemos preparar una propuesta sujeta a comprobaciones.',cls:'agent'}];if(S.nego.round>=1){messages.push({who:'Tú · oferta ficticia',text:`Propongo ${eur(Math.min(S.p.price-1000,218000))}, sujeto a visita, documentación y financiación.`,cls:'buyer'});messages.push({who:'Agente del vendedor · simulación',text:`Gracias. La propiedad puede estudiar ${eur(S.p.price-4000)}, sin compromiso real.`,cls:'seller'})}if(S.nego.round>=2){messages.push({who:'Tu gestor · contraoferta simulada',text:`Podemos mejorar hasta ${eur(Math.min(S.p.price-1000,224000))} si la documentación es correcta.`,cls:'buyer'});messages.push({who:'Agente del vendedor · simulación',text:`Podemos ajustar a ${eur(Math.min(S.p.price-1000,229000))}.`,cls:'seller'})}if(S.nego.round>=3){messages.push({who:'Tu gestor · propuesta final ficticia',text:`Proponemos ${eur(S.nego.agreed)} con revisión documental y condiciones de financiación.`,cls:'buyer'});messages.push({who:'Agente del vendedor · simulación',text:`Acuerdo de ejemplo por ${eur(S.nego.agreed)}. No existe aceptación ni contrato real.`,cls:'seller'})}return messages}
function negotiation(){let n=S.nego;return `${head('Paso 03 · Negociación','El precio también se negocia.','Tu agente prepara ofertas, el agente del vendedor responde y tú decides. Todo ocurre dentro de una simulación cerrada.',link('Ver el mercado de empresas','market','line'))}<div class="grid2"><div class="card pad-lg"><div class="eyebrow">Sala de negociación</div><h3>Conversación comprador ↔ vendedor</h3><div class="chat" aria-live="polite">${negoHistory().map(m=>`<div class="chat-msg ${m.cls}"><div class="who">${m.who}</div><p>${esc(m.text)}</p></div>`).join('')}</div><div class="notice">Ni el vendedor ni su agente existen: las respuestas están predefinidas. Ningún mensaje sale de esta web.</div><div class="row wrap">${n.round===0?b('Preparar primera oferta','offer-draft','1'):n.round===1?b('Negociar una mejora','offer-draft','2'):n.round===2?b('Preparar acuerdo final','offer-draft','3'):tag('Acuerdo ficticio alcanzado','green')}${b('Ver todas las decisiones','show-nego-log','','line')}${link('Ver las arras','legal','ghost')}</div></div><div class="gap" style="align-self:start"><div class="card pad-lg"><div class="eyebrow">Estrategia del comprador</div><h2>Negociar con argumentos.</h2><div class="kpi"><span>Precio solicitado</span><strong>${eur(S.p.price)}</strong></div><div class="kpi"><span>Primera oferta ficticia</span><strong>${eur(Math.min(S.p.price-1000,218000))}</strong></div><div class="kpi"><span>Precio final pactado</span><strong>${n.agreed?eur(n.agreed):'Todavía no'}</strong></div>${n.agreed?`<div class="notice green"><strong>Ahorro negociado de ejemplo: ${eur(S.p.price-n.agreed)}</strong><br>No es una garantía de descuento en una compra real.</div>`:`<div class="notice soft">El agente puede revisar precio, estado y comparables, pero ninguna negociación garantiza rebajas.</div>`}<div class="line"></div><div class="eyebrow">Qué se comunica</div><p class="small muted">Una oferta con precio, plazo, entrega, documentación solicitada y condición de financiación, siempre vista por el comprador antes de «enviarla» en modo ficticio.</p></div><div class="card pad"><div class="eyebrow">Otro lado del hall</div><h3>Así lo vería el vendedor</h3><p class="small muted">La empresa o propietario tiene su propio agente de simulación, con reglas de precio y respuesta.</p>${link('Ver su panel de ejemplo','partners','light')}</div></div></div>${footer()}`}
function market(){let f=finance();let categories=[['Bancos','Hipoteca y financiación','mortgage'],['Tasadoras','Presupuesto y visita','appraisal'],['Asesoría legal','Revisión documental y arras','legal'],['Notarías','Agenda y firma','notary'],['Reformas','Estimaciones de obra','visit'],['Seguros','Coberturas y precio total','after']];return `${head('Hall competitivo · Demo','Aquí las empresas vienen a por ti.','El comprador presenta lo que necesita. Las entidades compiten por una solicitud bien preparada. Todo es ficticio hasta que existan socios autorizados.',b('Simular publicación de la solicitud','hall-request')+link('Ver panel empresa','partners','line'))}

<div class="grid3">${categories.map((x,i)=>`<article class="card offer-card"><div class="row between"><div class="icon-tile">${['▤','▥','▣','♙','⌑','◇'][i]}</div>${tag('DEMO','gray')}</div><h3 style="margin-top:13px">${x[0]}</h3><p class="muted small">${x[1]}</p><div style="margin-top:13px">${link('Abrir propuestas →',x[2],'light full')}</div></article>`).join('')}</div>

function mortgageView(){let f=finance(),ranking=BANKS.map(z=>({...z,actualTin:z.tin-(S.hall.improved.includes(z.id)?.15:0),calc:finance(z.tin-(S.hall.improved.includes(z.id)?.15:0),z.years,z.open,z.insurance)}));return `${head('Paso 04 · Financiación','Que compitan por tu hipoteca.','Tres entidades ficticias preparan propuestas distintas. Compara la cuota, el coste total y las vinculaciones antes de escoger.',b('Solicitar propuestas ficticias','hall-request')+link('Volver al mercado','market','line'))}<div class="grid3">${ranking.map(z=>`<article class="card offer-card ${S.mortgage.chosen===z.id?'selected':''}"><div class="row between"><div class="brand-icon" style="background:${z.color}24;color:${z.color}">▤</div>${tag(S.mortgage.chosen===z.id?'Elegida':'DEMO',S.mortgage.chosen===z.id?'green':'')}</div><h3 style="margin-top:13px">${z.name}</h3><div class="rate">${pct(z.actualTin)}</div><p class="muted small">TIN fijo · ${z.years} años · oferta NO real</p><div class="line"></div><div class="kpi"><span>Cuota de préstamo</span><strong>${eur(z.calc.monthly)}/mes</strong></div><div class="kpi"><span>Seguros ilustrativos</span><strong>${eur(z.insurance)}/mes</strong></div><div class="kpi"><span>Desembolso total modelizado</span><strong>${eur(z.calc.total)}</strong></div><div class="kpi"><span>Productos / condiciones</span><strong style="font-size:11px">${z.links}</strong></div><div class="kpi"><span>TAE</span><strong>Sin cálculo</strong></div><div class="row wrap" style="margin-top:15px">${b('Detalles','bank-detail',z.id,'line small')}${b(S.mortgage.chosen===z.id?'Seleccionada ✓':'Elegir propuesta','choose-bank',z.id,S.mortgage.chosen===z.id?'light small':'primary small')}${b('Pedir mejora','improve-bank',z.id,'ghost small')}</div></article>`).join('')}</div><div class="grid2" style="margin-top:17px"><div class="card pad"><h3>Lo que revisaría tu agente hipotecario</h3><div class="itemlist">${['Importe, plazo y tipo fijo/variable','Comisiones de apertura y amortización',' function documents(){const ready=Object.keys(S.docs).filter(x=>S.docs[x]).length;return `${head('Carpeta documental','Todos los papeles, en orden.','Una carpeta para cada documento de compraventa. Puedes abrir su ejemplo, marcarlo como revisado y ver para qué sirve.',b('Generar dossier completo','download-dossier')+link('Preparar arras','legal','line'))}<div class="card pad" style="margin-bottom:16px"><div class="row between wrap"><div><div class="eyebrow">Tu carpeta</div><h3>${ready} de ${DOCS.length} documentos revisados en esta historia</h3></div>${tag('Archivos ficticios · No adjuntes DNI reales','green')}</div><div class="progress"><div style="width:${100*ready/DOCS.length}%"></div></div></div><div class="grid2">${DOCS.map(([id,title,help])=>`<article class="doc-card"><div class="row between"><span class="icon">▣</span>${tag(S.docs[id]?'Marcado ✓':'Por revisar',S.docs[id]?'green':'gray')}</div><h4>${title}</h4><p>${help}</p><div class="row wrap">${b('Ver ejemplo','doc-preview',id,'line small')}${b(S.docs[id]?'Desmarcar':'Marcar como revisado','doc-toggle',id,'light small')}</div></article>`).join('')}</div><div class="notice">Los documentos de ejemplo tienen la palabra DEMO y no sustituyen documentos oficiales. No se suben archivos ni se almacenan datos sensibles.</div>${footer()}`}
function appraisal(){let f=finance(),a=S.appraisal,limit=Math.min(price(),a.value)*.8;return `${head('Paso 06 · Tasación','Una tasación cambia la operación.','Comprueba cómo la tasación ficticia puede alterar el importe financiable. La tasación oficial requiere una sociedad homologada.',link('Revisar ofertas bancarias','mortgage','line'))}<div class="grid2"><div class="card pad-lg"><div class="eyebrow">Panel de tasación</div><h2>Visita del tasador</h2><p class="muted">Un agente organiza la cita y solicita el informe. En esta demo no contacta a ningún tasador.</p><div class="kpi"><span>Solicitud de ejemplo</span><strong>${a.requested?'Realizada en la simulación':'Sin solicitar'}</strong></div><div class="kpi"><span>Informe</span><strong>${a.done?'Disponible · DEMO':'Pendiente'}</strong></div><div class="row wrap" style="margin-top:16px">${b('Solicitar tasación ficticia','request-appraisal')}${a.requested?b('Recibir informe simulado','receive-appraisal','','light'):''}</div>${a.done?`<div class="notice green">El informe ficticio está listo. No es una tasación oficial válida para una hipoteca.</div>`:''}</div><div class="card pad-lg"><div class="eyebrow">Resultado financiero</div><h2>${a.done?'Informe didáctico':'Impacto estimado'}</h2><div class="kpi"><span>Precio negociado / de referencia</span><strong>${eur(price())}</strong></div><div class="kpi"><span>Tasación del ejemplo</span><strong>${a.done?eur(a.value):'Pendiente'}</strong></div><div class="kpi"><span>80 % del menor valor</span><strong>${a.done?eur(limit):'—'}</strong></div><div class="kpi"><span>Préstamo solicitado en la hipótesis</span><strong>${eur(f.loan)}</strong></div>${a.done?`<div class="notice ${f.loan<=limit?'green':''}">${f.loan<=limit?'El préstamo solicitado encajaría en este límite matemático de ejemplo.':'Con ese criterio, faltaría financiación para cubrir la operación.'} Esto no supone aprobación bancaria.</div>`:''}<div class="line"></div>${b('Cambiar valor de tasación ficticia','set-appraisal','','line')}</div></div>${footer()}`}
function legalDraft(){let p=price(),deposit=p*.10;return `BORRADOR DIDÁCTICO · NO VÁLIDO PARA FIRMA\n\nCONTRATO PRIVADO DE ARRAS (SIMULACIÓN)\n\nComprador: PERSONA FICTICIA A\nVendedor: PERSONA FICTICIA B\nVivienda: ${S.p.title}, ${S.p.address}, ${S.p.city}\nPrecio pactado (ejemplo): ${eur(p)}\nSeñal de ejemplo (10 %): ${eur(deposit)}\nResto en escritura: ${eur(p-deposit)}\n\nCONDICIONES DE EJEMPLO A REVISAR POR ABOGADO:\n1. Comprobar titularidad, cargas y situación urbanística.\n2. Identificar y describir correctamente la finca.\n3. Acordar fecha de escritura y entrega libre de cargas.\n4. Regular financiación, devolución de cantidades y penalizaciones con precisión.\n5. Establecer reparto de gastos según legislación vigente.\n\nEste documento es únicamente una pantalla educativa. No genera obligaciones, arras ni pagos.`}

lass="rrow"><span>Asesoramiento jurídico</span><strong>Necesario fuera de la demo</strong></div><small>DOCUMENTO DEMO · SIN FIRMAS NI VALIDEZ JURÍDICA</small></div></div>${footer()}`}

${n&&complete?`<div class="end-hero"><div class="eyebrow">Experiencia completada</div><span class="keys">⌂</span><h1 style="font-size:49px">Tu nuevo hogar. Todo bajo control.</h1><p class="muted">Has recorrido una compra de principio a fin. No se ha comprado ninguna vivienda real: esta es la simulación completa de Mi Inversión IA.</p><div class="row wrap" style="justify-content:center;margin-top:13px">${b('Ver resumen final','final-summary')}${b('Descargar mi dossier de ejemplo','download-dossier','','line')}${b('Repetir experiencia','reset','','light')}</div></div>`:''}

function tinyfish(){return `${head('Fuentes públicas y automatización','Así participaría TinyFish.','TinyFish es un agente navegador. En esta versión se muestra su papel de forma educativa, sin conectarlo al sitio ni ejecutar búsquedas desde la interfaz.',link('Ver agentes','agents','line'))}<div class="grid2"><div class="card pad-lg"><div class="row between"><div class="icon-tile">◎</div>${tag('NO CONECTADO')}</div><h2 style="margin-top:12px">Investigación de fuentes públicas</h2><p class="muted">En una versión operativa, TinyFish podría consultar páginas públicas autorizadas y devolver datos con fuente y fecha. No debe sortear restricciones técnicas o condiciones de los portales.</p><div class="kpi"><span>API TinyFish de la web</span><strong>No configurada</strong></div><div class="kpi"><span>Extracción automática de anuncios</span><strong>Inactiva</strong></div><div class="kpi"><span>Registro / Catastro / bancos</span><strong>Sin conexión</strong></div>${b('Ver ejemplo de informe de búsqueda','tinyfish-preview')}</div><div class="card pad-lg"><div class="eyebrow">Cómo se integraría</div><h3>El dato siempre necesita una fuente.</h3>${[['01','Consulta autorizada','Solo documentos o webs con acceso legítimo.'],['02','Recuperación y extracción','Precio, metros, fecha, fuente y condiciones de uso.'],['03','Validación del gestor','Comprobar unidades, antigüedad y pertinencia.'],['04','Informe para el comprador','Separar verificado, declarado y sin comprobar.']].map(x=>`<div class="item"><span class="numcircle">${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div></div><div class="notice green">TinyFish sí ha servido para probar desde fuera el funcionamiento de una versión anterior de la web; eso no significa que los compradores puedan utilizarlo todavía dentro del portal.</div>${footer()}`}

function closeModal(){document.getElementById('dialog-root').innerHTML='';document.body.style.overflow=''}
let tmr=null;function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('show'),3200)}
function userReport(){let f=finance(),cmp=comparableMedian(),bank=BANKS.find(x=>x.id===S.mortgage.chosen);return `MI INVERSIÓN IA · DOSSIER DE DEMOSTRACIÓN\nNINGUNO DE ESTOS DATOS ACREDITA UNA COMPRA O TRÁMITE REAL\n\nVIVIENDA\n${S.p.title}\n${S.p.address}, ${S.p.city} (${S.p.district})\nPrecio anunciado: ${eur(S.p.price)}\nSuperficie: ${S.p.area} m² · ${S.p.rooms} habitaciones\nPrecio anunciado por m²: ${eur(S.p.price/S.p.area)}\nComparables: ${cmp===null?'insuficientes':eur(cmp)+'/m² de referencias ficticias'}\n\nNEGOCIACIÓN SIMULADA\nRondas: ${S.nego.round}\nPrecio de acuerdo ficticio: ${S.nego.agreed?eur(S.nego.agreed):'Sin acuerdo'}\n\nFINANCIACIÓN (CÁLCULO HIPOTÉTICO)\nPrecio utilizado: ${eur(f.p)}\nEntrada: ${eur(f.down)}\nImpuestos de ejemplo: ${eur(f.taxes)}\nGastos estimados: ${eur(f.fees)}\nDinero inicial: ${eur(f.cash)}\nPrincipal: ${eur(f.loan)}\nCuota al ${f.tin}% durante ${f.years} años: ${eur(f.monthly)}\nIntereses del plazo: ${eur(f.totalInterest)}\nBanco seleccionado: ${bank?.name||'Ninguno'} (entidad ficticia)\nTAE: NO calculada; no hay FEIN real.\n\nVISITA: ${S.visits.time||'Sin fecha'} · ${S.visits.checked.length} de 8 puntos revisados.\nDOCUMENTOS MARCADOS: ${Object.values(S.docs).filter(Boolean).length} de 10.\nARRAS FICTICIAS: ${S.legal.arrasSigned?'Sí':'No'}.\nTASACIÓN DEMO: ${S.appraisal.done?eur(S.appraisal.value):'Pendiente'}.\nNOTARÍA DEMO: ${S.notary.signed?'Simulación de firma realizada':'Pendiente'}.\nPOSTFIRMA DEMO: ${S.after.done.length} de 6 trámites.\n\nTAREAS A REVISAR EN UNA COMPRA REAL:\n- Verificación de titularidad, cargas y situación urbanística.\n- Certificado energético, comunidad, impuestos y gastos.\n- Inspección técnica y financiación.\n- FEIN y revisión de contrato con profesionales.\n- Tasación homologada y escritura notarial.\n- Impuestos, registro, suministros y entrega.\n\nEste dossier se genera localmente en tu navegador. No ha habido contactos reales con vendedores, bancos, registros, tasadores, autoridades ni notarios.`}
function download(text,name){let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function reportTable(){let f=finance();return `<div class="kpi"><span>Vivienda</span><strong>${esc(S.p.title)}</strong></div><div class="kpi"><span>Precio anunciado</span><strong>${eur(S.p.price)}</strong></div><div class="kpi"><span>Precio final ficticio</span><strong>${eur(price())}</strong></div><div class="kpi"><span>Costes iniciales supuestos</span><strong>${eur(f.cash)}</strong></div><div class="kpi"><span>Cuota hipotética</span><strong>${eur(f.monthly)}</strong></div><div class="kpi"><span>Trámites posteriores</span><strong>${S.after.done.length}/6</strong></div>`}
function showDoc(id){let item=DOCS.find(d=>d[0]===id),txt=id==='arras'?legalDraft():id==='fein'?`FEIN FICTICIA · NO ES OFERTA VINCULANTE\nEntidad: ${BANKS.find(b=>b.id===S.mortgage.chosen)?.name||'Banco de ejemplo'} (inventada)\nPrincipal de ejemplo: ${eur(finance().loan)}\nTIN orientativo supuesto: ${pct(S.costs.tin)}\nTAE: NO CALCULADA\nNo incorpora costes ni obligaciones oficiales. Ninguna entidad ha emitido este documento.`:id==='escritura'?`ESCRITURA DE COMPRAVENTA · MODELO FICTICIO\nNOTARÍA INVENTADA\nFecha de ejemplo: ${S.notary.slot||'No fijada'}\nVivienda: ${S.p.address}, ${S.p.city}\nPrecio de ejemplo: ${eur(price())}\nComprador/a: PERSONA FICTICIA A\nVendedor/a: PERSONA FICTICIA B\nDOCUMENTO SIN VALIDEZ JURÍDICA.`:`${item?.[1]||'Documento'}\nDOCUMENTO FICTICIO PARA MOSTRAR EL PORTAL\nVivienda: ${S.p.title}\nEjemplo de qué datos debería contener esta clase de documento.\nDebe solicitarse y comprobarse con el organismo o profesional competente.`;return txt}

case 'save-visit':S.visits.notes=document.getElementById('visit-notes')?.value||'';log('Notas de visita guardadas','Inspección');toast('Notas guardadas en este navegador');return;
case 'offer-draft':{let round=Number(value)||Math.min(3,S.nego.round+1),amt=Math.round(S.p.price*({1:.912,2:.937,3:.946}[round]||.945)/1000)*1000;let copy=`Como comprador, propongo ${eur(amt)} por ${S.p.title}, con la revisión de documentación y, si se acuerda jurídicamente, condiciones de financiación y plazos definidos. La oferta debe aprobarse y enviarse por canales reales fuera de esta demo.`;modal('Revisa tu oferta antes de enviarla',`<div class="eyebrow">Ronda ${round} de 3 · Solo simulación</div><div class="metric" style="margin:13px 0"><span>Importe propuesto</span><strong>${eur(amt)}</strong></div><div class="field"><label>Borrador editable de muestra</label><textarea id="offer-text">${esc(copy)}</textarea></div><p class="small muted">La IA en producción sugeriría texto, pero tú decidirías cada envío. Esta versión solo simula que el vendedor lo recibe.</p>`,b('Aprobar el envío SOLO ficticio','offer-confirm',String(round))+b('Cancelar','close','','line'));return}
case 'offer-confirm':{let round=Number(value);if(round!==S.nego.round+1){closeModal();toast('Revisa el orden de las rondas');return}let agreed=Math.round(S.p.price*.946/1000)*1000;S.nego.round=round;S.nego.drafts.push(document.getElementById('offer-text')?.value||'Oferta ficticia');if(round===3){S.nego.agreed=agreed;log('Acuerdo de compra simulado por '+eur(agreed),'Negociación')}else log('Oferta y contraoferta ficticias de la ronda '+round,'Negociación');save();closeModal();render();toast(round===3?'Acuerdo de ejemplo alcanzado':'El vendedor ficticio ha respondido');return}
case 'show-nego-log':modal('Registro de ofertas de ejemplo',`<div class="gap">${negoHistory().map(m=>`<div class="company-row"><div class="who">${m.who}</div><div class="msg">${esc(m.text)}</div></div>`).join('')}</div>`,b('Volver a la sala','close','','line'));return;
case 'consent-preview':modal('Qué información compartirías',`<p>El comprador vería esta pantalla antes de enviar una solicitud a una empresa.</p><div class="kpi"><span>Ciudad</span><strong>${esc(S.p.city)}</strong></div><div class="kpi"><span>Precio objetivo</span><strong>${eur(price())}</strong></div><div class="kpi"><span>Financiación buscada</span><strong>${eur(finance().loan)}</strong></div><div class="kpi"><span>Identidad, DNI, ingresos, contacto</span><strong>NO compartidos</strong></div><div class="notice">En esta prueba no se comparten datos con nadie: ni siquiera los de la ficha.</div>`,b('Entendido','close','','line'));return;

function state(){if(!S.guide)S.guide={step:0,example:true,negotiated:false,visited:false,bankSlot:'',bankReady:false,notaryCity:S.p.city||'Santander',notaryOffice:'',notarySlot:'',signed:false};return S.guide}
function assessment(){const g=state();let priceM2=S.p.area>0?S.p.price/S.p.area:0;
 if(g.example){let median=2550,diff=(priceM2/median-1)*100;return {label:diff>7?'Precio elevado':diff< -7?'Precio por debajo':'Precio en rango',desc:'Comparativa con tres viviendas INVENTADAS de la misma zona, exclusivamente para la demostración.',diff,median,known:true};}
 let median=comparableMedian();if(median!==null){let diff=(priceM2/median-1)*100;return {label:diff>7?'Precio elevado':diff< -7?'Precio por debajo':'Precio en rango',desc:'Comparativa con los tres anuncios introducidos en Valoración. No son tasaciones verificadas.',diff,median,known:true};}
 return {label:'Faltan datos de mercado',desc:'El precio por m² está calculado, pero sin tres referencias verificables no podemos asegurar que esté caro o barato.',known:false};}
function cardStep(n){let g=state();return '<button class="flow-step '+(g.step===n?'on':'')+' '+(n<g.step?'done':'')+'" data-action="g-step" data-value="'+n+'"><span class="flow-num">'+(n<g.step?'✓':String(n+1).padStart(2,'0'))+'</span><span>'+names[n]+'</span></button>'}
function guideNav(){return '<aside class="side"><div class="logo"><div class="mark">⌂</div><div><strong>Mi Inversión IA</strong><small>COMPRA TU CASA CON CALMA</small></div></div><div class="side-group">Tu camino</div><nav class="nav">'+[['home','Mi compra guiada','⌂'],['valuation','Analizar el precio','◫'],['negotiation','Ver negociación','⇄'],['mortgage','Comparar hipotecas','▤'],['notary','Notaría y firma','✍']].map(r=>'<button type="button" class="'+(S.route===r[0]?'active':'')+'" data-action="go" data-value="'+r[0]+'"><span class="ic">'+r[2]+'</span>'+r[1]+'</button>').join('')+'</nav><div class="side-group">Opcional</div><nav class="nav"><button data-action="more" type="button"><span class="ic">☷</span>Ver todas las pantallas</button></nav><div class="side-bottom"><strong>Todo es una simulación</strong><p>Los bancos, vendedores, agendas y notarías son ficticios. No hay envíos ni reservas reales.</p></div></aside>'}
function guideMobileNav(){return '<nav class="mobile-foot" aria-label="Navegación rápida">'+[['home','⌂','Mi compra'],['valuation','◫','Precio'],['negotiation','⇄','Negociar'],['mortgage','▤','Bancos'],['more','☰','Más']].map(a=>'<button data-action="'+(a[0]==='more'?'more':'go')+'" data-value="'+a[0]+'" class="'+(S.route===a[0]?'active':'')+'"><span>'+a[1]+'</span>'+a[2]+'</button>').join('')+'</nav>'}
function lead(label,headline,description){return '<div class="flow-intro"><span class="eyebrow">'+label+'</span><h2>'+headline+'</h2><p class="muted">'+description+'</p></div>'}
function starting(){let g=state(),a=assessment(),per=S.p.area?S.p.price/S.p.area:0;return lead('PASO 01 · TU CASA','Pega un anuncio. Te diremos si merece su precio.','Empieza con el enlace de Idealista, Fotocasa u otro portal, o introduce los datos. En la demo no leemos enlaces automáticamente. Los resultados del ejemplo están claramente identificados.')+
'<div class="card pad-lg"><div class="row between wrap"><h3>La vivienda que te interesa</h3>'+tag(g.example?'DATOS DEL EJEMPLO':'DATOS INTRODUCIDOS')+'</div><form id="guide-ad-form" class="guide-form"><div class="field"><label for="guide-url">Enlace del anuncio</label><input id="guide-url" type="url" placeholder="https://..." value="'+esc(S.p.url||'')+'" /></div><div class="grid2"><div class="field"><label for="guide-price">Precio anunciado (€)</label><input id="guide-price" type="number" min="1" required value="'+S.p.price+'" /></div><div class="field"><label for="guide-area">Superficie (m²)</label><input id="guide-area" type="number" min="1" required value="'+S.p.area+'" /></div></div><div class="grid2"><div class="field"><label for="guide-city">Ciudad</label><input id="guide-city" required value="'+esc(S.p.city)+'" /></div><div class="field"><label for="guide-title">Descripción breve</label><input id="guide-title" required value="'+esc(S.p.title)+'" /></div></div><button class="btn primary" type="submit">Analizar esta vivienda →</button></form><p class="tiny muted" style="margin-top:12px">Si pegas una URL, edita precio y superficie manualmente. No afirmamos haber consultado un portal real.</p></div>'+
'<div class="flow-verdict"><span class="eyebrow">EJEMPLO DE RESULTADO</span><div class="row between wrap"><h3>'+esc(a.label)+'</h3>'+tag(a.known?'Comparación orientativa':'Sin comparables',a.known?'':'gray')+'</div><p class="muted">'+esc(a.desc)+'</p><div class="grid3">'+kpi('Precio anunciado',money(S.p.price))+kpi('Precio por m²',money(per)+'/m²')+kpi('Coste inicial estimado',money(finance().cashNeeded))+'</div>'+ (a.known?'<p class="flow-notice">'+(a.diff>0?'Aproximadamente '+dec(a.diff,1)+' % por encima del €/m² de referencia de esta muestra.':'Diferencia de '+dec(a.diff,1)+' % respecto a la muestra.')+'</p>':'')+'<div class="row wrap" style="margin-top:12px">'+b('Seguir con esta vivienda →','g-step','1')+link('Ver costes detallados','valuation','line')+'</div></div>'}

 case 'g-step':{const n=Math.max(0,Math.min(5,Number(value)));g.step=n;save();render();window.scrollTo({top:0,behavior:'instant'});return;}

 case 'g-bank-open':{const z=BANKS.find(x=>x.id===value);if(!z)return;modal('Pide cita con '+z.name+' · DEMO','<div class="notice">No hay conexión bancaria ni disponibilidad real.</div><form id="guide-bank-book"><input type="hidden" id="guide-bank-id" value="'+z.id+'"/><div class="field"><label for="guide-bank-slot">Cita ficticia</label><select id="guide-bank-slot"><option>Martes 01/12/2026 · 10:30</option><option>Miércoles 02/12/2026 · 16:00</option><option>Viernes 04/12/2026 · 11:45</option></select></div><button class="btn primary" type="submit" style="margin-top:15px">Confirmar solo en la simulación</button></form>');return;}
 case 'g-bank-approve':modal('¿Simular que el banco aprobó tu hipoteca?','<p>La demo marcará como revisados la solvencia, tasación, FEIN/FiAE y preparación del acta notarial previa. No se ha hecho ninguna gestión con una entidad real.</p><div class="notice">En una compra real estos pasos requieren comprobaciones y plazos, y el banco puede rechazar la financiación.</div>',b('Sí, aprobación ficticia y seguir','g-bank-approved')+b('Cancelar','close','','line'));return;
